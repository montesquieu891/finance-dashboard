name: CI

on:
  pull_request:

jobs:
  web-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: ESLint
        run: corepack pnpm --filter @basket-monitor/web lint

      - name: Typecheck
        run: corepack pnpm --filter @basket-monitor/web typecheck

  api-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install API dependencies
        run: |
          cd apps/api
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff
        run: |
          cd apps/api
          uv run ruff check .

      - name: Mypy
        run: |
          cd apps/api
          uv run mypy app/
